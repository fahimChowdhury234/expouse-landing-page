<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" fill="none">
  <defs>
    <filter id="s" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="600" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1a1a2e" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <g font-family="Cairo, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- phone -->
    <rect x="293.5" y="65.5" width="229" height="469" rx="34" fill="#ffffff" stroke="#1f2430" stroke-width="3" filter="url(#s)"/>
    <rect x="373" y="77" width="70" height="20" rx="10" fill="#1f2430"/>
    <text x="317" y="92" font-size="13" font-weight="700" fill="#1f2430">9:41</text>
    <rect x="462" y="88" width="3" height="5" rx="1" fill="#1f2430"/>
    <rect x="467" y="86" width="3" height="7" rx="1" fill="#1f2430"/>
    <rect x="472" y="84" width="3" height="9" rx="1" fill="#1f2430"/>
    <rect x="481.75" y="83.75" width="19.5" height="9.5" rx="3" stroke="#1f2430" stroke-width="1.5"/>
    <rect x="484" y="86" width="12" height="5" rx="1.5" fill="#1f2430"/>

    <!-- app header -->
    <path d="M315 117.5l-6 6 6 6" stroke="#1f2430" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="324" y="129" font-size="16" font-weight="700" fill="#1f2430">Keynote</text>
    <rect x="449" y="113" width="58" height="22" rx="11" fill="#fef2f2"/>
    <circle cx="462" cy="124" r="3.5" fill="#ef4444"/>
    <text x="471" y="128.5" font-size="13" font-weight="700" fill="#ef4444">LIVE</text>

    <!-- tabs -->
    <rect x="309" y="146" width="198" height="30" rx="15" fill="#f4f2fd"/>
    <rect x="377" y="148" width="62" height="26" rx="13" fill="#6452E7"/>
    <text x="342" y="165.5" text-anchor="middle" font-size="13" font-weight="600" fill="#4b5160">Chat</text>
    <text x="408" y="165.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Q&amp;A</text>
    <text x="474" y="165.5" text-anchor="middle" font-size="13" font-weight="600" fill="#4b5160">Polls</text>

    <!-- sort switch -->
    <rect x="309.5" y="188.5" width="129" height="25" rx="12.5" fill="#ffffff" stroke="#e8e9ee"/>
    <rect x="312" y="191" width="56" height="20" rx="10" fill="#efedfc"/>
    <path d="M325 205.5v-9M321.5 200l3.5-3.5 3.5 3.5" stroke="#6452E7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="333" y="205.5" font-size="13" font-weight="700" fill="#6452E7">Top</text>
    <text x="403" y="205.5" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">Newest</text>
    <text x="507" y="205.5" text-anchor="end" font-size="13" fill="#9aa1ad">38 asked</text>

    <!-- 1: answering now -->
    <rect x="309.5" y="226.5" width="197" height="87" rx="12" fill="#efedfc" stroke="#d9d4fa"/>
    <circle cx="335" cy="248" r="14" fill="#ecfdf5"/>
    <text x="335" y="252.5" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">SA</text>
    <text x="357" y="245" font-size="14" font-weight="700" fill="#1f2430">Sara Ali</text>
    <path d="M463 241l4-4 4 4" stroke="#6452E7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="495" y="245" text-anchor="end" font-size="13" font-weight="700" fill="#6452E7">24</text>
    <text x="357" y="262" font-size="13" font-weight="700" fill="#6452E7">Answering now</text>
    <text x="357" y="282" font-size="14" fill="#1f2430">How do they stay</text>
    <text x="357" y="300" font-size="14" fill="#1f2430">cool without AC?</text>

    <!-- 2: anonymous -->
    <rect x="309.5" y="322.5" width="197" height="67" rx="12" fill="#ffffff" stroke="#e8e9ee"/>
    <circle cx="335" cy="344" r="14" fill="#eef0f3"/>
    <text x="335" y="349" text-anchor="middle" font-size="14" font-weight="700" fill="#6b7280">?</text>
    <text x="357" y="341" font-size="14" font-weight="700" fill="#6b7280">Anonymous</text>
    <path d="M463 337l4-4 4 4" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="495" y="341" text-anchor="end" font-size="13" font-weight="700" fill="#6b7280">19</text>
    <text x="357" y="360" font-size="14" fill="#4b5160">Do these homes cost</text>
    <text x="357" y="378" font-size="14" fill="#4b5160">more to insure?</text>

    <!-- 3 -->
    <rect x="309.5" y="398.5" width="197" height="51" rx="12" fill="#ffffff" stroke="#e8e9ee"/>
    <circle cx="335" cy="420" r="14" fill="#efedfc"/>
    <text x="335" y="424.5" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">DC</text>
    <text x="357" y="417" font-size="14" font-weight="700" fill="#1f2430">Daniel Carter</text>
    <path d="M463 413l4-4 4 4" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="495" y="417" text-anchor="end" font-size="13" font-weight="700" fill="#6b7280">17</text>
    <text x="357" y="436" font-size="14" fill="#4b5160">What does it cost?</text>

    <!-- ask input -->
    <rect x="309.5" y="462.5" width="197" height="41" rx="20.5" fill="#f7f8fa" stroke="#e8e9ee"/>
    <text x="325" y="488" font-size="14" fill="#9aa1ad">Ask a question…</text>
    <circle cx="486" cy="483" r="15" fill="#6452E7"/>
    <path d="M486 489.5v-12M480.5 483l5.5-5.5 5.5 5.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="368" y="520" width="80" height="4" rx="2" fill="#1f2430"/>

    <!-- floating: sent for approval -->
    <rect x="107" y="459" width="206" height="48" rx="24" fill="#ffffff" filter="url(#s)"/>
    <rect x="107.5" y="459.5" width="205" height="47" rx="23.5" stroke="#e8e9ee"/>
    <circle cx="132" cy="483" r="12" fill="#fffbeb"/>
    <circle cx="132" cy="483" r="6" stroke="#f59e0b" stroke-width="2"/>
    <path d="M132 480v3l2 1.5" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="152" y="488" font-size="14" font-weight="700" fill="#1f2430">Sent for approval</text>

    <!-- floating: moderation -->
    <rect x="543" y="150" width="300" height="268" rx="16" fill="#ffffff" filter="url(#s)"/>
    <rect x="543.5" y="150.5" width="299" height="267" rx="15.5" stroke="#e8e9ee"/>
    <text x="567" y="184" font-size="16" font-weight="700" fill="#1f2430">Waiting for approval</text>
    <rect x="734" y="169" width="28" height="22" rx="11" fill="#fffbeb"/>
    <text x="748" y="184.5" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">3</text>
    <text x="567" y="204" font-size="13" fill="#6b7280">Moderator · Keynote · Hall A</text>
    <path d="M567 222.5H819" stroke="#e8e9ee"/>

    <circle cx="585" cy="258" r="18" fill="#e0f2fe"/>
    <text x="585" y="263" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">JP</text>
    <text x="613" y="254" font-size="15" font-weight="700" fill="#1f2430">James Park</text>
    <text x="613" y="272" font-size="13" fill="#6b7280">Halcyon Institute · just now</text>
    <text x="567" y="310" font-size="16" font-weight="600" fill="#1f2430">Will the slides be shared</text>
    <text x="567" y="332" font-size="16" font-weight="600" fill="#1f2430">after the talk?</text>

    <rect x="567" y="358" width="120" height="36" rx="10" fill="#6452E7"/>
    <path d="M588 376.5l3.5 3.5 6.5-7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="606" y="381" font-size="14" font-weight="700" fill="#ffffff">Approve</text>
    <rect x="697.5" y="358.5" width="91" height="35" rx="10" fill="#ffffff" stroke="#e8e9ee"/>
    <text x="743" y="381" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2430">Reject</text>
  </g>
</svg>
