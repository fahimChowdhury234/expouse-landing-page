<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" fill="none">
  <defs>
    <filter id="s" filterUnits="userSpaceOnUse" x="0" y="-60" width="960" height="720" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1a1a2e" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <g font-family="Cairo, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" transform="translate(0 12)">

    <g transform="translate(-8 0)">
    <!-- stage screen -->
    <rect x="354" y="384" width="12" height="86" fill="#d5d8de"/>
    <rect x="290" y="470" width="140" height="10" rx="5" fill="#d5d8de"/>
    <rect x="110" y="64" width="500" height="320" rx="18" fill="#1f2430"/>
    <rect x="120" y="74" width="480" height="300" rx="10" fill="#272d3b"/>

    <rect x="144" y="96" width="58" height="24" rx="12" fill="#ef4444"/>
    <circle cx="157" cy="108" r="3.5" fill="#ffffff"/>
    <text x="165" y="112.5" font-size="13" font-weight="700" fill="#ffffff">LIVE</text>
    <text x="214" y="112.5" font-size="13" fill="#9aa1ad">Keynote · Hall A</text>
    <text x="576" y="113" text-anchor="end" font-size="14" font-weight="700" fill="#e8e9ee">412 votes</text>

    <text x="144" y="158" font-size="24" font-weight="700" fill="#ffffff">Which material will matter</text>
    <text x="144" y="188" font-size="24" font-weight="700" fill="#ffffff">most by 2030?</text>

    <text x="144" y="235" font-size="15" font-weight="600" fill="#f1f2f5">Rammed earth</text>
    <rect x="344" y="223" width="188" height="14" rx="7" fill="#353c4c"/>
    <rect x="344" y="223" width="71" height="14" rx="7" fill="#a78bfa"/>
    <text x="576" y="235" text-anchor="end" font-size="15" font-weight="700" fill="#ffffff">38%</text>

    <text x="144" y="273" font-size="15" font-weight="600" fill="#f1f2f5">Cross-laminated timber</text>
    <rect x="344" y="261" width="188" height="14" rx="7" fill="#353c4c"/>
    <rect x="344" y="261" width="51" height="14" rx="7" fill="#6452E7"/>
    <text x="576" y="273" text-anchor="end" font-size="15" font-weight="700" fill="#ffffff">27%</text>

    <text x="144" y="311" font-size="15" font-weight="600" fill="#f1f2f5">Low-carbon concrete</text>
    <rect x="344" y="299" width="188" height="14" rx="7" fill="#353c4c"/>
    <rect x="344" y="299" width="41" height="14" rx="7" fill="#6452E7"/>
    <text x="576" y="311" text-anchor="end" font-size="15" font-weight="700" fill="#ffffff">22%</text>

    <text x="144" y="349" font-size="15" font-weight="600" fill="#f1f2f5">Recycled steel</text>
    <rect x="344" y="337" width="188" height="14" rx="7" fill="#353c4c"/>
    <rect x="344" y="337" width="24" height="14" rx="7" fill="#6452E7"/>
    <text x="576" y="349" text-anchor="end" font-size="15" font-weight="700" fill="#ffffff">13%</text>
    </g>

    <g transform="translate(16 0)">
    <!-- floating: new poll / type picker -->
    <rect x="580" y="112" width="270" height="300" rx="16" fill="#ffffff" filter="url(#s)"/>
    <rect x="580.5" y="112.5" width="269" height="299" rx="15.5" stroke="#e8e9ee"/>
    <text x="604" y="144" font-size="16" font-weight="700" fill="#1f2430">New poll</text>
    <text x="604" y="172" font-size="13" font-weight="600" fill="#6b7280">Poll type</text>

    <rect x="604.75" y="184.75" width="220.5" height="42.5" rx="10" fill="#f4f2fd" stroke="#6452E7" stroke-width="1.5"/>
    <circle cx="624" cy="206" r="7" stroke="#6452E7" stroke-width="2"/>
    <circle cx="624" cy="206" r="3" fill="#6452E7"/>
    <text x="642" y="211" font-size="14" font-weight="700" fill="#1f2430">Single choice</text>
    <circle cx="807" cy="206" r="9" fill="#6452E7"/>
    <path d="M803 206.3l2.7 2.7 4.8-5.2" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="604.5" y="236.5" width="221" height="43" rx="10" fill="#ffffff" stroke="#e8e9ee"/>
    <rect x="617" y="251" width="14" height="14" rx="3.5" stroke="#6b7280" stroke-width="2"/>
    <path d="M620.5 258.2l2.3 2.3 4.4-4.8" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="642" y="263" font-size="14" font-weight="600" fill="#1f2430">Multiple choice</text>

    <rect x="604.5" y="288.5" width="221" height="43" rx="10" fill="#ffffff" stroke="#e8e9ee"/>
    <path transform="translate(624 310.5)" d="M0-7.5L1.84-2.52 7.13-2.32 2.97.96 4.41 6.07 0 3.12-4.41 6.07-2.97.96-7.13-2.32-1.84-2.52Z" stroke="#6b7280" stroke-width="1.75" stroke-linejoin="round"/>
    <text x="642" y="315" font-size="14" font-weight="600" fill="#1f2430">Rating 1–5</text>
    <g fill="#f59e0b">
      <path transform="translate(748 310)" d="M0-6.5L1.59-2.18 6.18-2.01 2.57.83 3.82 5.26 0 2.7-3.82 5.26-2.57.83-6.18-2.01-1.59-2.18Z"/>
      <path transform="translate(764 310)" d="M0-6.5L1.59-2.18 6.18-2.01 2.57.83 3.82 5.26 0 2.7-3.82 5.26-2.57.83-6.18-2.01-1.59-2.18Z"/>
      <path transform="translate(780 310)" d="M0-6.5L1.59-2.18 6.18-2.01 2.57.83 3.82 5.26 0 2.7-3.82 5.26-2.57.83-6.18-2.01-1.59-2.18Z"/>
      <path transform="translate(796 310)" d="M0-6.5L1.59-2.18 6.18-2.01 2.57.83 3.82 5.26 0 2.7-3.82 5.26-2.57.83-6.18-2.01-1.59-2.18Z"/>
    </g>
    <path transform="translate(812 310)" d="M0-6.5L1.59-2.18 6.18-2.01 2.57.83 3.82 5.26 0 2.7-3.82 5.26-2.57.83-6.18-2.01-1.59-2.18Z" fill="#e8e9ee"/>

    <rect x="604" y="348" width="222" height="40" rx="10" fill="#6452E7"/>
    <text x="715" y="373" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Launch poll</text>
    </g>

    <!-- floating: export -->
    <rect x="480" y="432" width="340" height="72" rx="16" fill="#ffffff" filter="url(#s)"/>
    <rect x="480.5" y="432.5" width="339" height="71" rx="15.5" stroke="#e8e9ee"/>
    <rect x="500" y="450" width="36" height="36" rx="10" fill="#ecfdf5"/>
    <path d="M518 458.5v11M513 464.5l5 5 5-5M512 474.5h12" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="548" y="464" font-size="14" font-weight="700" fill="#1f2430">Export results</text>
    <text x="548" y="482" font-size="13" fill="#6b7280">Keynote poll · 412 votes</text>
    <rect x="740.5" y="452.5" width="59" height="31" rx="10" fill="#ffffff" stroke="#e8e9ee"/>
    <text x="770" y="473" text-anchor="middle" font-size="13" font-weight="700" fill="#6452E7">CSV</text>
  </g>
</svg>
