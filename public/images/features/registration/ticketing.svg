      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1a1a2e" flood-opacity=".13"/>
    </filter>
    <path id="tk" d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2zM14 5v2M14 11v2M14 17v2"/>
  </defs>
  <g font-family="Cairo, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
