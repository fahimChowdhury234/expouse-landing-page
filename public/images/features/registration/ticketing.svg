    <g filter="url(#s)">
      <rect x="596" y="424" width="296" height="62" rx="14" fill="#ecfdf5"/>
    </g>
    <rect x="596.5" y="424.5" width="295" height="61" rx="14" stroke="#a7f3d0"/>
    <circle cx="630" cy="455" r="16" fill="#10b981"/>
    <path d="M623 455.5l4.5 4.5 8.5-9" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="658" y="450" font-size="15" font-weight="700" fill="#065f46">Payment received</text>
    <text x="658" y="470" font-size="13" font-weight="600" fill="#047857">Invoice sent to Omar Saleh</text>
