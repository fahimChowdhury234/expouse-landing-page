    <text x="536" y="272" font-size="14" fill="#4b5160">Subtotal</text>
    <text x="868" y="272" text-anchor="end" font-size="14" fill="#4b5160">OMR 100.000</text>
    <text x="536" y="298" font-size="14" fill="#059669">Discount · GULF20</text>
    <text x="868" y="298" text-anchor="end" font-size="14" font-weight="600" fill="#059669">−OMR 20.000</text>
    <path d="M536 314.5H868" stroke="#e8e9ee"/>
    <text x="536" y="344" font-size="16" font-weight="700" fill="#1f2430">Total</text>
    <text x="868" y="345" text-anchor="end" font-size="20" font-weight="800" fill="#1f2430">OMR 80.000</text>

    <rect x="536" y="364" width="332" height="44" rx="10" fill="#6452E7"/>
    <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="590" y="378" width="22" height="16" rx="3"/>
      <path d="M590 383.5h22"/>
    </g>
    <text x="622" y="391.5" font-size="15" font-weight="700" fill="#ffffff">Pay by card · OMR 80.000</text>

