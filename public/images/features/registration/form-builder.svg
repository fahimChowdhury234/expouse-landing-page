<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" fill="none">
  <defs>
    <filter id="s" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="600">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1a1a2e" flood-opacity=".13"/>
    </filter>
  </defs>
  <g font-family="Cairo, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="960" height="600" fill="#ffffff"/>

    <!-- Main form canvas -->
    <rect x="100.5" y="48.5" width="459" height="495" rx="16" fill="#ffffff" stroke="#e8e9ee"/>
    <text x="124" y="84" font-size="18" font-weight="700" fill="#1f2430">Registration form</text>
    <path d="M101 104.5H559" stroke="#e8e9ee"/>

    <!-- Full name -->
    <text x="124" y="132" font-size="14" font-weight="600" fill="#1f2430">Full name <tspan fill="#ef4444">*</tspan></text>
    <rect x="124.5" y="140.5" width="411" height="34" rx="8" fill="#ffffff" stroke="#e8e9ee"/>
    <text x="138" y="162.5" font-size="14" fill="#9aa1ad">As it should appear on the badge</text>

    <!-- Email -->
    <text x="124" y="198" font-size="14" font-weight="600" fill="#1f2430">Email <tspan fill="#ef4444">*</tspan></text>
    <rect x="124.5" y="206.5" width="411" height="34" rx="8" fill="#ffffff" stroke="#e8e9ee"/>
    <text x="138" y="228.5" font-size="14" fill="#9aa1ad">name@company.com</text>

    <!-- Guest type -->
    <text x="124" y="264" font-size="14" font-weight="600" fill="#1f2430">Guest type <tspan fill="#ef4444">*</tspan></text>
    <rect x="124.5" y="272.5" width="411" height="34" rx="8" fill="#ffffff" stroke="#e8e9ee"/>
    <circle cx="143" cy="289.5" r="5" fill="#f59e0b"/>
    <text x="156" y="294.5" font-size="14" font-weight="600" fill="#1f2430">Media</text>
    <path d="M512 287l5 5 5-5" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Press card upload (selected, conditional) -->
    <rect x="112" y="322" width="436" height="144" rx="12" fill="#f4f2fd" stroke="#6452E7" stroke-width="2"/>
    <text x="128" y="348" font-size="14" font-weight="700" fill="#1f2430">Press card upload <tspan fill="#ef4444">*</tspan></text>
    <rect x="128.5" y="360.5" width="241" height="26" rx="13" fill="#ffffff" stroke="#d6d0f8"/>
    <g transform="translate(140 366) scale(.6)" stroke="#6452E7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3v12"/>
      <circle cx="18" cy="6" r="3"/>
      <circle cx="6" cy="18" r="3"/>
      <path d="M18 9a9 9 0 0 1-9 9"/>
    </g>
    <text x="162" y="378" font-size="13" font-weight="600" fill="#6452E7">Shown if Guest type is Media</text>
    <rect x="128.5" y="398.5" width="403" height="51" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-dasharray="5 4"/>
    <g stroke="#6452E7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M152 432v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
      <path d="M160 429v-14M155 420l5-5 5 5"/>
    </g>
    <text x="180" y="429" font-size="14" font-weight="600" fill="#1f2430">Upload press card</text>
    <text x="320" y="429" font-size="13" fill="#9aa1ad">PDF or JPG</text>

    <!-- Add field -->
    <rect x="124.5" y="482.5" width="411" height="38" rx="10" fill="#ffffff" stroke="#d6d0f8" stroke-dasharray="5 4"/>
    <path d="M281 501.5h10M286 496.5v10" stroke="#6452E7" stroke-width="2" stroke-linecap="round"/>
    <text x="298" y="506.5" font-size="14" font-weight="700" fill="#6452E7">Add field</text>

    <!-- Approval card -->
    <g filter="url(#s)">
      <rect x="540" y="72" width="320" height="106" rx="14" fill="#ffffff"/>
    </g>
    <rect x="540.5" y="72.5" width="319" height="105" rx="14" stroke="#e8e9ee"/>
    <rect x="560" y="92" width="36" height="36" rx="10" fill="#fffbeb"/>
    <g stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="575" cy="105" r="4"/>
      <path d="M568 119v-1a5 5 0 0 1 5-5h4"/>
      <path d="M580 116l2.5 2.5 5-5"/>
    </g>
    <text x="608" y="108" font-size="15" font-weight="700" fill="#1f2430">Approval step</text>
    <text x="608" y="128" font-size="13" fill="#6b7280">Before the badge is sent</text>
    <rect x="800" y="96" width="40" height="24" rx="12" fill="#6452E7"/>
    <circle cx="828" cy="108" r="9" fill="#ffffff"/>
    <text x="560" y="158" font-size="14" font-weight="600" fill="#4b5160">Media &amp; VIP need approval</text>

    <!-- Rule card -->
    <g filter="url(#s)">
      <rect x="520" y="300" width="340" height="190" rx="14" fill="#ffffff"/>
    </g>
    <rect x="520.5" y="300.5" width="339" height="189" rx="14" stroke="#e8e9ee"/>
    <rect x="540" y="320" width="36" height="36" rx="10" fill="#efedfc"/>
    <g transform="translate(549 329) scale(.75)" stroke="#6452E7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3v12"/>
      <circle cx="18" cy="6" r="3"/>
      <circle cx="6" cy="18" r="3"/>
      <path d="M18 9a9 9 0 0 1-9 9"/>
    </g>
    <text x="588" y="336" font-size="15" font-weight="700" fill="#1f2430">Display logic</text>
    <text x="588" y="354" font-size="13" fill="#6b7280">Press card upload</text>

    <text x="540" y="388" font-size="13" font-weight="600" fill="#6b7280">Show if</text>
    <rect x="540.5" y="398.5" width="115" height="34" rx="8" fill="#f7f8fa" stroke="#e8e9ee"/>
    <text x="552" y="420.5" font-size="14" font-weight="600" fill="#1f2430">Guest type</text>
    <path d="M637 413l4 4 4-4" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="663.5" y="398.5" width="55" height="34" rx="8" fill="#f7f8fa" stroke="#e8e9ee"/>
    <text x="676" y="420.5" font-size="14" font-weight="600" fill="#1f2430">is</text>
    <path d="M700 413l4 4 4-4" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="726.5" y="398.5" width="113" height="34" rx="8" fill="#efedfc" stroke="#6452E7"/>
    <circle cx="742" cy="415.5" r="5" fill="#f59e0b"/>
    <text x="754" y="420.5" font-size="14" font-weight="700" fill="#1f2430">Media</text>
    <path d="M821 413l4 4 4-4" stroke="#6452E7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M545 463.5h10M550 458.5v10" stroke="#6452E7" stroke-width="2" stroke-linecap="round"/>
    <text x="562" y="468" font-size="13" font-weight="700" fill="#6452E7">Add condition</text>
  </g>
</svg>
